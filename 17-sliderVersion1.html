<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Slider (Version 1)</title>
    <style>
        .container {
            width: fit-content;
            height: fit-content;
            margin: 200px auto;

            h1 {
                width: fit-content;
                height: fit-content;
                margin: 30px auto;
                color: black;
            }

            p {
                width: fit-content;
                height: fit-content;
                margin: 10px auto;
                color: black;
                font-size: 16px;
            }

            .slider {
                width: 700px;
                height: 200px;
                margin: 50px auto;
                position: relative;

                .slides {
                    width: 100%;
                    height: 100%;
                    ;
                    display: flex;
                    border-radius: 20px;
                    border: 4px solid rgb(220, 144, 51);
                    overflow: hidden;

                    .slide {
                        width: 100%;
                        height: 100%;
                        flex-shrink: 0;
                        transition: all 0.5s ease;

                        img {
                            width: 100%;
                            height: 100%;
                            object-fit: cover;
                        }
                    }
                }


                .prev,
                .next {
                    width: 35px;
                    height: 35px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    border-radius: 100%;
                    background-color: rgb(220, 144, 51);
                    border: none;

                    img {
                        width: 100%;
                        height: 100%;
                    }
                }

                .prev {
                    position: absolute;
                    top: 50%;
                    translate: 0 -50%;
                    left: 10px;
                }

                .next {
                    position: absolute;
                    top: 50%;
                    translate: 0 -50%;
                    right: 10px;
                }

            }



        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to The Slider (Version 1)!</h1>
        <p>you can go to the previous or next item ...</p>
        <div class="slider">
            <div class="slides">
                <div class="slide"><img src="images/slider-1.jpg" alt=""></div>
                <div class="slide"><img src="images/slider-2.jpg" alt=""></div>
                <div class="slide"><img src="images/slider-3.jpg" alt=""></div>
                <div class="slide"><img src="images/slider-4.jpg" alt=""></div>
            </div>
            <button class="prev"><img src="images/prev.svg" alt=""></button>
            <button class="next"><img src="images/next.svg" alt=""></button>
            <div class="pagination"></div>
        </div>
    </div>

    <script>
        let counter = 0;

        let slides = document.querySelectorAll(".slide");
        let prev = document.querySelector(".prev");
        let next = document.querySelector(".next");

        function moveSlider(counter) {
            slides.forEach((slide) => {
                slide.style.translate = `${-700 * counter}px 0`;
            });
        }

        prev.addEventListener("click", () => {
            if (counter > 0) {
                counter--;
                moveSlider(counter);
            }
        });

        next.addEventListener("click", () => {
            if (counter < slides.length - 1) {
                counter++;
                moveSlider(counter);
            }
        });
    </script>

</body>

</html>
