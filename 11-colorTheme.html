<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Color Theme!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .color-1,
        .color-2,
        .color-3,
        .color-4,
        .color-5,
        .color-6,
        .color-7,
        .color-8,
        .color-9,
        .color-10 {
            width: 100%;
            height: 10.1vh;
            ;
            top: -10vh;
            right: 0;
            position: fixed;
            transition: top 1s ease;
            line-height: 10.1vh;
            text-align: center;
            font-size: 15px;
        }

        .color-1 {
            background-color: #FFF0F3;
            z-index: 10;
        }

        .color-2 {
            background-color: #FFE0E6;
            z-index: 9;
        }

        .color-3 {
            background-color: #FFC2D1;
            z-index: 8;
        }

        .color-4 {
            background-color: #FFA3BA;
            z-index: 7;
        }

        .color-5 {
            background-color: #FF85A5;
            z-index: 6;
        }

        .color-6 {
            background-color: #FF7096;
            z-index: 5;
        }

        .color-7 {
            background-color: #F95D8A;
            z-index: 4;
        }

        .color-8 {
            background-color: #F4457D;
            z-index: 3;
        }

        .color-9 {
            background-color: #E93670;
            z-index: 2;
        }

        .color-10 {
            background-color: #D92763;
            z-index: 1;
        }

        h1 {
            width: fit-content;
            height: fit-content;
            margin: 0 auto;
            margin-top: 300px;
            color: #D92763;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .click {
            width: fit-content;
            height: fit-content;
            margin: 20px auto;
            color: #2c2d2e;
            font-size: 16px;
        }

        .click:hover {
            color: #D92763;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="colors">
        <div class="color-1">#FFF0F3</div>
        <div class="color-2">#FFE0E6</div>
        <div class="color-3">#FFC2D1</div>
        <div class="color-4">#FFA3BA</div>
        <div class="color-5">#FF85A5</div>
        <div class="color-6">#FF7096</div>
        <div class="color-7">#F95D8A</div>
        <div class="color-8">#F4457D</div>
        <div class="color-9">#E93670</div>
        <div class="color-10">#D92763</div>
    </div>
    <h1>Welcome to The Odd One Out!</h1>
    <div class="click">click here for the show ...</div>
    <script>
        click = document.querySelector(".click")
        click.addEventListener("click", () => {
            for (let i = 1; i <= 10; i++) {
                color = document.querySelector(".color-" + i)
                color.style.top = (i - 1) * 10 + "vh"
            }
        })
    </script>
</body>


</html>
