<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Slider</title>
    <style>
        body {
            background-color: rgb(248, 229, 206);
        }

        .container {
            width: fit-content;
            height: fit-content;
            margin: 160px auto;

            h1 {
                width: fit-content;
                height: fit-content;
                margin: 30px auto;
                color: black;
            }

            p {
                width: 600px;
                height: fit-content;
                margin: 10px auto;
                color: black;
                font-size: 16px;
            }

            .slider {
                width: 1000px;
                height: 300px;
                margin: 50px auto;
                position: relative;

                .slides {
                    width: 100%;
                    height: 100%;
                    ;
                    display: flex;
                    border-radius: 20px;
                    border: 4px solid rgb(220, 144, 51);
                    overflow: hidden;

                    .slide {
                        width: 100%;
                        height: 100%;
                        flex-shrink: 0;
                        transition: all 0.5s ease;

                        img {
                            width: 100%;
                            height: 100%;
                            object-fit: cover;
                        }
                    }
                }


                .prev,
                .next {
                    width: 35px;
                    height: 35px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    border-radius: 100%;
                    background-color: rgb(220, 144, 51);
                    border: none;

                    img {
                        width: 100%;
                        height: 100%;
                    }
                }

                .prev:disabled,
                .next:disabled {
                    opacity: 50%;
                    cursor: not-allowed;
                }

                .prev {
                    position: absolute;
                    top: 50%;
                    translate: 0 -50%;
                    left: 10px;
                }

                .next {
                    position: absolute;
                    top: 50%;
                    translate: 0 -50%;
                    right: 10px;
                }

            }



        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to The Slider!</h1>
        <p>click on the prev and next button by mouse or press on right and left arrow on keyboard to go the previous or next item ...</p>
        <div class="slider">
            <div class="slides">
                <div class="slide"><img src="images/slider-1.jpg" alt=""></div>
                <div class="slide"><img src="images/slider-2.jpg" alt=""></div>
                <div class="slide"><img src="images/slider-3.jpg" alt=""></div>
                <div class="slide"><img src="images/slider-4.jpg" alt=""></div>
            </div>
            <button class="prev"><img src="images/prev.svg" alt=""></button>
            <button class="next"><img src="images/next.svg" alt=""></button>
            <div class="pagination"></div>
        </div>
    </div>

    <script>

        let counter = 0;
        let slides = document.querySelectorAll(".slide");
        let prev = document.querySelector(".prev");
        let next = document.querySelector(".next");

        function moveSlider(counter) {
            slides.forEach((slide) => {
                slide.style.translate = `${-1000 * counter}px 0`;
            });
        }

        const isDisabled = () => {
            if (counter === 0) {
                prev.disabled = true;
                next.disabled = false;
            } else if (counter === slides.length - 1) {
                prev.disabled = false;
                next.disabled = true;
            } else {
                prev.disabled = false;
                next.disabled = false;
            }
        }
        isDisabled()

        // Movement By Mouse Click
        prev.addEventListener("click", () => {
            if (counter > 0) {
                counter--;
                moveSlider(counter);
                isDisabled()
            }
        });

        next.addEventListener("click", () => {
            if (counter < slides.length - 1) {
                counter++;
                moveSlider(counter);
                isDisabled()
            }
        });


        // Movement By Keyboard Press
        window.addEventListener("keydown", (e) => {
            if (e.key == "ArrowLeft") {
                if (counter > 0) {
                    counter--;
                    moveSlider(counter);
                    isDisabled();
                }
            }
            else if (e.key == "ArrowRight") {
                if (counter < slides.length - 1) {
                    counter++;
                    moveSlider(counter);
                    isDisabled();
                }
            }
        });


    </script>

</body>

</html>
