
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Countdown</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #fff8dc, #ffe680);
        }

        .container {
            width: 500px;
            padding: 35px;
            border-radius: 25px;
            background-color: #fffdf5;
            box-shadow: 0 15px 40px rgba(120, 95, 0, 0.15);
            text-align: center;
        }

        h1 {
            color: #5c4700;
            font-size: 30px;
            margin-bottom: 15px;
        }

        p {
            color: #8a7635;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .number {
            width: 65%;
            height: 50px;
            padding: 13px;
            border: 2px solid #f5d45c;
            border-radius: 12px;
            outline: none;
            font-size: 17px;
            background-color: #fffaf0;
            transition: 0.3s;
        }

        .number:focus {
            border-color: #e5ae00;
            box-shadow: 0 0 8px rgba(229, 174, 0, 0.25);
        }

        .start {
            height: 50px;
            padding: 13px 22px;
            border: none;
            border-radius: 12px;
            background-color: #f5c518;
            color: #493800;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .start:hover {
            background-color: #e6ad00;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(180, 130, 0, 0.2);
        }

        .counter {
            width: 150px;
            height: 150px;
            border: 6px solid #f5d45c;
            border-radius: 50%;
            background: linear-gradient(145deg, #fff5c2, #ffe58a);
            margin: 35px auto 10px;
            font-size: 48px;
            font-weight: bold;
            color: #705500;
            line-height: 138px;
            box-shadow: 0 8px 20px rgba(180, 140, 0, 0.15);
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome to The Countdown!</h1>

        <p>Write a number in seconds and press start ...</p>

        <input class="number" type="text" placeholder="Enter seconds">

        <button class="start" onclick="count()">Start</button>

        <div class="counter">0</div>

    </div>

    <script>

        let interval;

        function count() {

            let number = Number(document.querySelector(".number").value);
            let counter = document.querySelector(".counter");

            if (number > 0) {

                clearInterval(interval);

                counter.innerHTML = number;

                interval = setInterval(function () {

                    number--;

                    counter.innerHTML = number;

                    if (number === 0) {
                        clearInterval(interval);
                    }

                }, 1000);

            }

        }

    </script>

</body>

</html>
