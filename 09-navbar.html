<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Navbar</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            padding: 0;
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
        }

        .menu {
            width: 40px;
            height: 40px;

            img {
                width: 100%;
                height: 100%;
            }
        }


        ul {
            display: none;
            list-style: none;
            padding: 0;
            margin: 0;

            li {
                width: 100%;
                height: 40px;
                line-height: 40px;
                background-color: gainsboro;
                margin-top: 2px;
                text-align: center;

                a {
                    text-decoration: none;
                    color: rgb(55, 53, 53);
                }

            }
        }

        @media (min-width: 768px) {

            .menu {
                display: none;

            }

            ul {
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: row;
                gap: 30px;
                background-color: gainsboro;
            }

            ul li {
                width: fit-content;
                background-color: none;
            }

        }


        .container {
            width: fit-content;
            margin: 30px auto;
            padding: 5px 0;
            text-align: center;

            h1 {
                color: rgb(55, 53, 53);
                font-size: 30px;
                margin-bottom: 15px;
            }

            p {
                color: rgb(55, 53, 53);
                font-size: 16px;
                margin-bottom: 25px;
            }

        }
    </style>
</head>

<body>
    <div class="header">
        <div class="menu" onclick="chaneMenuState()"><img src="images/burger-menu.svg" alt=""></div>
        <ul class="submenu">
            <li><a href="">Home</a></li>
            <li><a href="">AboutUs</a></li>
            <li><a href="">ContactUs</a></li>
            <li><a href="">More</a></li>
        </ul>
    </div>

    <div class="container">

        <h1>Welcome to The Navbar!</h1>

        <p>press on hamburger menu to show the submenu in mobile-size screen ...</p>
    </div>

    <script>
        if (window.innerWidth < 768) {
            const submenu = document.querySelector(".submenu")
            let menuState = "close"
            function chaneMenuState() {
                if (menuState === "close") {
                    menuState = "open";
                    submenu.style.display = "block";
                }
                else {
                    menuState = "close";
                    submenu.style.display = "none";
                }
            }
        }
    </script>

</body>

</html>
