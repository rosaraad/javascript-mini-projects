<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mini Counter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            background-color: #e2eedf;
            width: fit-content;
            height: fit-content;
            margin: 30vh auto;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #c5d8bf;
            box-shadow: 0 5px 15px rgba(70, 100, 70, 0.08);
        }

        h1 {
            text-align: center;
            font-size: 30px;
            color: #3a4e3b;
        }

        p {
            text-align: center;
            font-size: 14px;
            color: #496b4b;
        }

        .counter {
            width: 40px;
            height: 40px;
            margin: 0 auto;
            background-color: #fbfdf9;
            border-radius: 10px;
            border: 1px solid #c5d8bf;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #496b4b;
            font-size: 20px;
        }

        .buttons {
            width: fit-content;
            height: fit-content;
            margin: 20px auto;
            margin-bottom: 0;
        }

        button {
            background-color: #c6ddc1;
            border: 1px solid #b3cdae;
            border-radius: 7px;
            padding: 7px 12px;
            color: #405e43;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #a9c9a4;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to the Mini Counter!</h1>
        <p>click on the buttons to set the counter ...</p>
        <div class="counter" id="counter">0</div>
        <div class="buttons">
            <button onclick="increase()">+</button>
            <button onclick="decrease()">-</button>
            <button onclick="reset()">reset</button>
        </div>
    </div>

    <script>
        let count = 0

        function increase() {
            count += 1
            document.getElementById("counter").innerHTML = count
        }

        function decrease() {
            if (count - 1 >= 0) {
                count -= 1
            }
            document.getElementById("counter").innerHTML = count
        }

        function reset() {
            count = 0
            document.getElementById("counter").innerHTML = count
        }
    </script>
</body>

</html>
