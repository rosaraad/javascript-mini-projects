<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Navbar Scroller</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .header {
            background-color: black;
            width: 100%;
            height: 50px;
            line-height: 50px;
            overflow: hidden;

            .menu {
                width: fit-content;
                height: fit-content;
                display: flex;
                column-gap: 20px;
                margin: 0 auto;
                position: relative;

                .item {
                    width: fit-content;
                    height: 100%;
                    text-align: center;
                    text-decoration: none;
                    color: white;
                    cursor: pointer;
                }

                .item:hover{
                    color: rgb(238, 251, 197);
                }

            }
        }

        .container {
            h1 {
                width: fit-content;
                height: fit-content;
                margin: 30px auto;
                color: black;
            }

            p {
                width: fit-content;
                height: fit-content;
                margin: 30px auto;
                color: #2c2d2e;
                font-size: 16px;
            }

            .section-title {
                width: 100%;
                height: 40px;
                margin: 0;
                line-height: 40px;
                background-color: rgb(238, 251, 197);
                text-align: center;
            }

            .section-content {
                width: 100%;
                height: 500px;
                background-color: rgb(116, 123, 93);
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="menu">
            <div class="item">Home</div>
            <div class="item">AboutUs</div>
            <div class="item">ContactUs</div>
            <div class="item">Gallery</div>
            <div class="item">Services</div>
        </div>
    </div>
    <div class="container">
        <h1>Welcome to The Navbar Scroller!</h1>
        <p>press on an item in the menu to get to that section ...</p>
        <h4 class="section-title">home</h4>
        <div class="section-content"></div>
        <h4 class="section-title">AboutUs</h4>
        <div class="section-content"></div>
        <h4 class="section-title">ContactUs</h4>
        <div class="section-content"></div>
        <h4 class="section-title">Gallery</h4>
        <div class="section-content"></div>
        <h4 class="section-title">Services</h4>
        <div class="section-content"></div>
    </div>

    <script>
        links = document.querySelectorAll(".item")
        sections = document.querySelectorAll(".section-title")
        links.forEach((element, index) => {
            element.addEventListener("click", () => {
                window.scrollTo({
                    top: sections[index].offsetTop,
                    behavior: "smooth"
                });
            });
        });
    </script>

</body>

</html>
