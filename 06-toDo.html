<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The toDOList</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5e5e5;
        }

        .container {
            width: 550px;
            height: fit-content;
            padding: 20px 25px;
            margin: 30vh auto;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(106, 48, 48, 0.13);
            background-color: #fffafa;
        }

        h1 {
            color: rgb(72, 14, 14);
            text-align: center;
            font-size: 30px;
            letter-spacing: -0.5px;
        }

        p {
            color: rgb(106, 48, 48);
            text-align: left;
            font-size: 15px;
            margin-bottom: 22px;
        }

        .div-input {
            width: 100%;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            column-gap: 10px;

            input {
                width: 400px;
                height: 100%;
                border-radius: 8px;
                border: 1px solid #e5cccc;
                padding-left: 15px;
                background-color: #fffdfd;
                outline: none;
                transition: 0.25s;
            }

            input:focus {
                border-color: rgb(106, 48, 48);
                box-shadow: 0 0 0 3px rgba(106, 48, 48, 0.09);
            }

            input:hover {
                border-color: rgb(106, 48, 48);
            }

            .date {
                width: 130px;
                height: 100%;
                border-radius: 8px;
                border: 1px solid #e5cccc;
                background-color: #fffdfd;
                padding: 0 5px;
            }

            .date:hover {
                border-color: rgb(106, 48, 48);
            }

            button {
                width: 40px;
                height: 40px;
                background-color: rgb(106, 48, 48);
                border: none;
                border-radius: 8px;
                color: white;
                font-size: 17px;
                font-weight: bold;
                transition: 0.25s;
                box-shadow: 0 3px 8px rgba(106, 48, 48, 0.18);
            }

            button:hover {
                cursor: pointer;
                background-color: rgb(64, 27, 27);
                transform: translateY(-2px);
                box-shadow: 0 5px 12px rgba(106, 48, 48, 0.22);
            }
        }

        .list {
            width: 100%;
            height: fit-content;
            margin-top: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            row-gap: 12px;

            .list-task {
                width: 100%;
                height: 48px;
                padding: 5px 10px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                column-gap: 10px;
                background-color: #f8eeee;
                border: 1px solid #efdada;
                border-radius: 9px;
                transition: 0.2s;
            }

            .list-task:hover {
                background-color: #f4e3e3;
                box-shadow: 0 3px 10px rgba(106, 48, 48, 0.07);
            }

            .list-task-name {
                width: 350px;
                height: 100%;
                padding-left: 10px;
                display: flex;
                align-items: center;
                font-size: 14px;
                color: #572525;
            }

            .list-task-date {
                width: 130px;
                height: 100%;
                display: flex;
                align-items: center;
                font-size: 13px;
                color: #986c6c;
                text-align: left;
            }

            button {
                width: 30px;
                height: 30px;
                border: none;
                border-radius: 7px;
                background-color: #e9cccc;
                color: #762d2d;
                font-weight: bold;
                transition: 0.2s;
                cursor: pointer;
            }

            button:hover {
                background-color: rgb(235, 52, 52);
                color: white;
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to The toDO list!</h1>
        <p>Enter the task and choose the date then click on add ...</p>
        <div class="div-input">
            <input class="task" type="text" placeholder="add the task ...">
            <input class="date" type="date" name="" id="">
            <button onclick="addTask()">add</button>
        </div>


        <div class="list"></div>
    </div>

    <script>
        let toDoList = []

        function render() {
            let toDoList_HTML = ""
            for (let i = 0; i < toDoList.length; i++) {
                let { name, duedate } = toDoList[i]
                toDoList_HTML += `
                <div class="list-task">
                    <div class="list-task-name">${name}</div>
                    <div class="list-task-date">${duedate}</div>
                    <button onclick="delTask(${i})">
                        X
                    </button>
                </div>
                `
            }
            document.querySelector(".list").innerHTML = toDoList_HTML
            document.querySelector(".task").value = ""
            document.querySelector(".date").value = ""
        }
        function addTask() {
            let task = document.querySelector(".task").value
            let date = document.querySelector(".date").value

            if (task == "" || date == "") {
                alert("Please enter a task and pick a date!")
            } else {
                toDoList.push({ name: task, duedate: date })
            }
            render()
        }
        function delTask(i) {
            toDoList.splice(i, 1)
            render()
        }

    </script>
</body>

</html>
